<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formatador OFX</title>
</head>
<body>
    <h2>Formatar Extrato OFX</h2>

    <form method="post" enctype="multipart/form-data">

        <button type="submit">Enviar e formatar</button>
    </form>
</body>
</html>
